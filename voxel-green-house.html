<!doctype html>

<style>

<body>
<div id="night"></div>
<div id="ui">
  <button id="replay">Replay (R)</button>
  <button id="pause">Pause (Space)</button>
  <label><input type="checkbox" id="loop" checked> Loop</label>
  <label><input type="checkbox" id="orbit" checked> Orbit</label>
  <label>Intro <select id="intro"><option value="none">None</option><option value="blueprint">Blueprint</option></select></label>
  <label>Order <select id="order"><option value="layers">Layers</option><option value="scan">3D print</option><option value="stages">Stages</option></select></label>
  <label>Motion <select id="motion"><option value="drop">Drop</option><option value="grow">Grow</option><option value="swarm">Swarm</option><option value="tornado">Tornado</option><option value="slide">Slide</option><option value="pop">Pop</option><option value="tumble">Tumble</option><option value="squash">Squash</option><option value="flash">Flash</option></select></label>
  <label>Detail <select id="res"><option value="1">1 · coarse</option><option value="2">2</option><option value="3">3</option><option value="4">4 · fine</option></select></label>
  <label>Ending <select id="outro"><option value="reset">Reset</option><option value="demolish">Demolish</option><option value="pile">Pile &amp; rebuild</option></select></label>
  <label>Sky <select id="sky"><option value="day">Day</option><option value="night">Day → night</option></select></label>
  <div id="bar"><i></i></div>
  <span id="info" style="opacity:.75"></span>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Voxel subdivision: each design unit is S×S×S small voxels. Override with ?res=1..4
const Q = new URLSearchParams(location.search);
const S = Math.max(1, Math.min(4, parseInt(Q.get('res')) || 2));
// Animation style (see SKILL.md, Animation modes). Set the scene's defaults here; ?intro= ?order= ?motion= ?outro= ?sky= override.
//   intro:  none | blueprint (see-through outline of the finished model first, then it fills in)
//   order:  layers (bottom up, jittered) | scan (3D printer: strict layers, sweeping head) | stages (by STAGE tag)
//   motion: drop | grow | swarm | tornado | slide | pop | tumble | squash | flash (see POSE)
//   outro:  reset (hold, then restart) | demolish (collapse in reverse build order, rebuild) | pile (heap up, rebuild from the heap)
//   sky:    day | night (dusk falls a few seconds after the build completes)
const ANIM = { intro: 'none', order: 'layers', motion: 'drop', outro: 'reset', sky: 'day' };
for (const k in ANIM) ANIM[k] = Q.get(k) || ANIM[k];
if (!Q.has('motion') && ANIM.order === 'scan') ANIM.motion = 'grow';

// =====================================================================================================
// ENGINE: helpers (keep as is)
// =====================================================================================================
function hash(x, z, s = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(z | 0, 668265263) ^ Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function vnoise(x, z, sc, s = 0) {
  x /= sc; z /= sc;
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi, s), b = hash(xi + 1, zi, s), c = hash(xi, zi + 1, s), d = hash(xi + 1, zi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
let seed = 1234;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pick = a => a[Math.floor(rnd() * a.length)];

// Fine-grid voxel store; e = false (lit), true (glowing), 'glass' (semi-transparent).
// The +256 key offset matters: the island underside goes to negative y.
// TAG marks what a voxel is so passes can treat it differently (see SKILL.md, Fire, smoke and steam).
const V = new Map();
const key = (x, y, z) => ((x + 256) * 1024 + (y + 256)) * 1024 + (z + 256);
// STAGE groups voxels for ?order=stages: lower stages build first (0 ground, 1 walls, 2 openings, 3 roof, 4 props).
let TAG = 0, STAGE = 0;
const fset = (x, y, z, c, e = false) => V.set(key(x, y, z), { x, y, z, c, e, g: TAG, st: STAGE });
const fdel = (x, y, z) => V.delete(key(x, y, z));
const fhas = (x, y, z) => V.has(key(x, y, z));
const dc = f => (f - (S - 1) / 2) / S;                 // fine cell -> design coordinate
const col = (c, x, y, z) => typeof c === 'function' ? c(x, y, z) : Array.isArray(c) ? c[Math.floor(hash(x * 7 + y, z, 3) * c.length)] : c;
function fbox(x0, y0, z0, x1, y1, z1, c, e = false) {
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) fset(x, y, z, col(c, x, y, z), e);
}
const box = (x0, y0, z0, x1, y1, z1, c, e) => fbox(x0 * S, y0 * S, z0 * S, x1 * S + S - 1, y1 * S + S - 1, z1 * S + S - 1, c, e);
function shell(x0, y0, z0, x1, y1, z1, c) {            // hollow box, one fine voxel thick (design units)
  const X0 = x0 * S, X1 = x1 * S + S - 1, Y0 = y0 * S, Y1 = y1 * S + S - 1, Z0 = z0 * S, Z1 = z1 * S + S - 1;
  for (let x = X0; x <= X1; x++) for (let y = Y0; y <= Y1; y++) for (let z = Z0; z <= Z1; z++)
    if (x === X0 || x === X1 || y === Y0 || y === Y1 || z === Z0 || z === Z1) fset(x, y, z, col(c, x, y, z));
}
// plane helpers: axis 'x' = wall at fixed fine z (a runs along x), 'z' = wall at fixed fine x (a runs along z)
const pset = (axis, a, y, l, c, e) => axis === 'x' ? fset(a, y, l, c, e) : fset(l, y, a, c, e);
const pdel = (axis, a, y, l) => axis === 'x' ? fdel(a, y, l) : fdel(l, y, a);
function disc(cx, cz, r0, r1, fy0, fy1, c, e) {        // ring/disc, design centre + radii, fine y range
  for (let fx = Math.floor((cx - r1 - 1) * S); fx <= Math.ceil((cx + r1 + 1) * S); fx++)
    for (let fz = Math.floor((cz - r1 - 1) * S); fz <= Math.ceil((cz + r1 + 1) * S); fz++) {
      const d = Math.hypot(dc(fx) - cx, dc(fz) - cz);
      if (d >= r0 && d <= r1) for (let fy = fy0; fy <= fy1; fy++) fset(fx, fy, fz, col(c, fx, fy, fz), e);
    }
}
function blob(cx, cy, cz, r, pal, sy = 1, rough = 0.6, e = false) {   // noisy ellipsoid (leaves, bushes, smoke)
  const R = r + 1;
  for (let fx = Math.floor((cx - R) * S); fx <= Math.ceil((cx + R) * S); fx++)
    for (let fy = Math.floor((cy - R * sy) * S); fy <= Math.ceil((cy + R * sy) * S); fy++)
      for (let fz = Math.floor((cz - R) * S); fz <= Math.ceil((cz + R) * S); fz++) {
        const d = Math.hypot(dc(fx) - cx, (dc(fy) - cy) / sy, dc(fz) - cz);
        if (d <= r + (rnd() - 0.5) * rough) fset(fx, fy, fz, pick(pal), e);
      }
}
// face-connected line between two design points (trunks, branches, poles): steps one axis at a time
function limb(x0, y0, z0, x1, y1, z1, pal, thick = 1) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0, z1 - z0) * S * 1.5);
  const put = (fx, fy, fz) => { for (let a = 0; a < thick; a++) for (let b = 0; b < thick; b++) fset(fx + a, fy, fz + b, col(pal, fx + a, fy, fz + b)); };
  let px = Math.round(x0 * S), py = Math.round(y0 * S), pz = Math.round(z0 * S);
  put(px, py, pz);
  for (let i = 1; i <= n; i++) {
    const t = i / n, fx = Math.round((x0 + (x1 - x0) * t) * S), fy = Math.round((y0 + (y1 - y0) * t) * S), fz = Math.round((z0 + (z1 - z0) * t) * S);
    while (px !== fx) { px += Math.sign(fx - px); put(px, py, pz); }
    while (pz !== fz) { pz += Math.sign(fz - pz); put(px, py, pz); }
    while (py !== fy) { py += Math.sign(fy - py); put(px, py, pz); }
  }
}

// =====================================================================================================
// SCENE: sage-green stucco house, one and a half storeys under a green metal-tile gable roof. Front gable:
// two teal doors, globe lamps, a recessed corner loggia upstairs; a canted bay on the left side; metal
// chimney, roof ladder, skylights, antenna. Garden from the photos (paved parking with a red car, lavender,
// mugo pines, roses on obelisks, rose arch, hose reels) plus an imagined back: raised terrace behind a
// block wall, shed, veg beds, bench, birch and pine.
// =====================================================================================================
const P = {
  lawn: [0x5f9a3c, 0x68a443, 0x578f36],
  lawnDry: [0x8f9a52, 0x84914a],
  worn: [0x9a9460, 0x8c8a58, 0x868a50],
  weed: [0x4f8a32, 0x6a9a3a, 0x3d6e2a, 0x7fa848],
  litter: [0x7a6a34, 0x8f7a3a, 0x6a5a2e, 0x5f7a30],
  topsoil: [0x5a4a36, 0x4f412f],
  under: [0x8a8478, 0x7c766b, 0x6e695f, 0x605b53],
  wall: [0xa2b59c, 0x9eb198, 0xa8baa2, 0x9aad94],
  surround: [0xe4e6e1, 0xdadcd6, 0xeceee9],
  plinth: [0x8f8789, 0x878083, 0x968e90],
  plinthJoint: 0x6a6365,
  frame: 0xf4f4f0,
  reveal: 0xcfd1cb,
  sill: 0x5c6e60,
  door: [0x1f4a4b, 0x1c4546],
  doorLine: 0x143637,
  doorFrame: 0x163a3b,
  roof: [0x7a9a7a, 0x74947a, 0x80a07f],
  roofLine: 0x5a735d,
  roofCap: 0x5d7562,
  soffit: 0xeef0ec,
  gutter: 0xdfe3e2,
  chimney: [0x506358, 0x58695f, 0x485a50],
  pave: [0xa79d95, 0x9c928b, 0xb2a89f, 0x958b84],
  paveJoint: 0x7c746e,
  mulch: [0x6e5a44, 0x7a6449, 0x665240],
  floor: 0x8a6a4c,
  leaf: [0x3f7a35, 0x4a8a3c, 0x356a2e],
  leafDark: [0x2f5a2c, 0x3b6b34, 0x2a5228],
  pine: [0x2a4a2c, 0x335634, 0x243f26],
  pineBark: [0x8a5a3a, 0x7a4e30],
  birch: [0x6f9a3e, 0x7aa848, 0x5f8a36],
  birchBark: [0xe8e6e0, 0xdedcd4, 0xe2e0da, 0x3a3a36],
  apple: [0x4f8a3a, 0x5a9842, 0x47803a, 0x4f8a3a, 0xc0392b],
  bark: [0x4a3a2c, 0x3d3024],
  thuja: [0x3a6a2e, 0x447634, 0x335e2a],
  box: [0x3a6a30, 0x427536, 0x33602b],
  shrub: [0x4f8a3a, 0x5a9842, 0x47803a],
  mugo: [0x2f4a2a, 0x38562f, 0x2a4226],
  bigleaf: [0x9cbf3c, 0x8aad34, 0xb2cc52, 0x7a9a30],
  rose: [0x4f7d3a, 0x5a8a42, 0x4a7536, 0x4f7d3a, 0xe890b0, 0xf2c0d0],
  lavender: [0x8a78c0, 0x9a88cc, 0x7a68b0],
  lavStem: [0x7d8f6c, 0x8a9a78],
  block: [0x9a9690, 0x8f8b85, 0xa4a09a],
  blockJoint: 0x6e6a66,
  metal: 0xc4c8cc,
  black: 0x1e2220,
  arch: 0x2f6a46,
  terracotta: [0xb06a42, 0xa05e3a],
  wood: [0x8a6a48, 0x7a5c3c],
  shed: [0x7a5a3e, 0x6e5036, 0x84623f],
};
const GLOW = 0xf6f2e6;             // milky globe lamps
const GLASS = 0x5f9cc4;
const tmp = new THREE.Color(), tmp2 = new THREE.Color();

const CX = 29, CZ = 28;            // island centre (design units)
const GY = 3, TOP = GY * S;        // ground surface is fine layer TOP-1; things stand from TOP
const F = v => Math.round(v * S);  // design edge -> fine edge
const ec = f => (f + 0.5) / S;     // fine cell -> design edge coordinate (design cell n spans [n, n+1))
// Only fixtures emit light: lamp() registers a baked light tied to a glowing voxel `src` of its fixture (fine cells).
const LAMPS = [];
const lamp = (src, fx, fy, fz, o = {}) => LAMPS.push({ src, fx, fy, fz, color: 0xffc070, power: 1.6, r: 3.5, ...o });

// ---------- ground plan (edge coordinates) ----------
const inMain = (x, z) => x >= 20 && x < 40 && z >= 16 && z < 40;
const inBay = (x, z) => x >= 17 && x < 20 && z >= 20 && z < 31 && x + z >= 40 && x - z >= -11;   // canted bay, left side
const inFoot = (x, z) => inMain(x, z) || inBay(x, z);
const terraceX = z => 48 + Math.sin(z / 5) * 0.7;
const onTerrace = (x, z) => x >= terraceX(z) && z < 30;                     // raised back-right lawn
const isRetain = (x, z) => onTerrace(x, z) && (x < terraceX(z) + 1 || z >= 29);
const isPave = (x, z) => !inFoot(x, z) && ((z >= 40.3 && z < 52 + vnoise(x, 0, 4, 6) * 2 && x >= 9 + vnoise(z, 0, 4, 5) * 2.5 && x < 45 + vnoise(z, 1, 4, 7) * 2) || (x >= 40.3 && x < 46.5 && z >= 37));
const isBedX = (x, z) => x >= 40.3 && x < 44.4 && z >= 13 && z < 37;       // lavender + mugo bed, right side
const isBedB = (x, z) => z >= 12.2 && z < 16 && x >= 19 && x < 40.3;        // rose bed along the back
const isWorn = (x, z) => z > 11 && z < 40.5 && Math.abs(x - 13.8 - Math.sin(z / 4.5) * 0.9) < 0.7 + vnoise(x, z, 2, 9) * 0.6;
const flatHere = (x, z) => inFoot(x, z) || isPave(x, z) || isBedX(x, z) || isBedB(x, z) || (x > 15 && x < 47 && z > 12 && z < 44);
const heightAt = (x, z) => onTerrace(x, z) ? 2 : (!flatHere(x, z) && vnoise(x, z, 6, 71) > 0.72 ? 0.5 : 0);
const gy = (x, z) => GY + heightAt(x, z);

// ---------- island: irregular lobed outline, rounded rim bumps, one iceberg rock mass underneath ----------
const ISLAND = 7;
const LOBES = [2, 3, 5].map((n, i) => ({ n, a: [3.2, 2.4, 1.3][i] * (0.6 + hash(n, i, ISLAND) * 0.8), p: hash(i, n, ISLAND + 1) * 6.283 }));
function edgeR(x, z) {
  const th = Math.atan2(z - CZ, x - CX), K = 14;
  const u = (th / (2 * Math.PI) + 0.5) * K + (vnoise(th * 4 + 9, 3, 1, 8) - 0.5) * 0.5;
  const k = Math.floor(u), f = u - k, bump = Math.sin(Math.PI * f) ** 2;
  const amp = 0.6 + Math.pow(hash(((k % K) + K) % K, 0, 61 + ISLAND), 2) * 5;
  const lobe = LOBES.reduce((s, l) => s + l.a * Math.sin(l.n * th + l.p), 0);
  const ragged = (vnoise(x, z, 9, 62 + ISLAND) - 0.5) * 5 + (vnoise(x, z, 3.5, 63) - 0.5) * 1.6;
  return 33 + lobe + ragged + amp * bump;
}
const LO = (CX - 52) * S, WD = 104 * S, OUT = 1 << 14;
const bottom = new Int32Array(WD * WD).fill(OUT), top = new Int32Array(WD * WD).fill(-OUT);
const idx = (fx, fz) => (fx - LO) * WD + (fz - LO);
const inGrid = (fx, fz) => fx >= LO && fz >= LO && fx < LO + WD && fz < LO + WD;
const botAt = (fx, fz) => inGrid(fx, fz) ? bottom[idx(fx, fz)] : OUT;
const topAt = (fx, fz) => inGrid(fx, fz) ? top[idx(fx, fz)] : -OUT;
for (let fx = LO; fx < LO + WD; fx++) for (let fz = LO; fz < LO + WD; fz++) {
  const x = dc(fx), z = dc(fz), dx = x - CX, dz = z - CZ;
  const e = edgeR(x, z) - Math.pow(dx ** 4 + dz ** 4, 0.25);
  if (e < 0) continue;
  top[idx(fx, fz)] = TOP - 1 + Math.round(heightAt(ec(fx), ec(fz)) * S);
  const ra = Math.min(1, Math.hypot(x - CX - 2, z - CZ + 1) / 40);
  const facet = (Math.floor(vnoise(x, z, 6, 51) * 5) / 5 - 0.4) * 5;
  const depth = 2 + Math.min(1, e / 4) * (28 * Math.pow(1 - ra, 1.4) + facet * (1 - ra));
  bottom[idx(fx, fz)] = TOP - 1 - Math.max(S, Math.round(depth * S));
}
const paveC = (fx, fz) => {
  const id = Math.floor((fx + (fz % 2) * 1) / 2), hh = hash(id, fz, 75);
  return hh > 0.93 ? P.paveJoint : hh < 0.015 ? 0x6f6862 : P.pave[Math.floor(hash(id, fz, 76) * P.pave.length)];   // the odd cracked paver
};
const blockC = (fx, fy, fz) => ((fz + fx + ((fy >> 1) & 1) * 2) % 4 === 0 || fy % 2 === 0 && hash(fx, fz, fy) < 0.3) ? P.blockJoint
  : P.block[Math.floor(hash((fx + fz) >> 2, fy >> 1, 77) * 3)];
function surfaceC(x, z, fx, fz) {
  if (inFoot(x, z)) return P.floor;
  if (isRetain(x, z)) return blockC(fx, 99, fz);
  if (isPave(x, z)) return paveC(fx, fz);
  if (isBedX(x, z) || isBedB(x, z)) return pick(P.mulch);
  if (isWorn(x, z) && hash(fx, fz, 74) < 0.75) return pick(P.worn);
  if (vnoise(x, z, 5, 72) > 0.74 && hash(fx, fz, 73) < 0.8) return pick(P.lawnDry);
  return P.lawn[(Math.floor((x + z * 0.15) / 3) % 2 + 2) % 2 + (hash(fx, fz, 2) > 0.85 ? 1 : 0)];
}
STAGE = 0; TAG = 4;
for (let fx = LO; fx < LO + WD; fx++) for (let fz = LO; fz < LO + WD; fz++) {
  const b = botAt(fx, fz);
  if (b === OUT) continue;
  const t = topAt(fx, fz), x = ec(fx), z = ec(fz);
  const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([a, c]) => [botAt(fx + a, fz + c), topAt(fx + a, fz + c)]);
  for (let fy = b; fy <= t; fy++) {
    if (fy !== b && fy !== t && nb.every(([nbot, ntop]) => nbot < fy && ntop > fy)) continue;
    let c;
    if (isRetain(x, z) && fy >= TOP - 1 - S) c = blockC(fx, fy, fz);
    else if (fy > t - 2 * S) c = surfaceC(x, z, fx, fz);
    else c = P.under[Math.min(3, Math.floor((TOP - fy) / (6 * S)))];
    fset(fx, fy, fz, c);
  }
  const lawnHere = !inFoot(x, z) && !isPave(x, z) && !isRetain(x, z) && !isBedX(x, z) && !isBedB(x, z);
  if (lawnHere && hash(fx, fz, 41) < 0.03) fset(fx, t + 1, fz, pick(P.lawn));             // grass tufts
  else if (lawnHere && hash(fx, fz, 42) < 0.004) fset(fx, t + 1, fz, pick([0xffffff, 0xf2d64a]));   // daisies, buttercups
}

TAG = 0;

// ---------- house: walls, roof height map ----------
const E = GY + 9, EF = F(E), SLOPE = 0.85;
const X0 = F(20), X1 = F(40) - 1, Z0 = F(16), Z1 = F(40) - 1;               // outer wall cells
const X0R = F(18.5), X1R = F(41.5) - 1, Z0R = F(15), Z1R = F(41) - 1;       // roof incl. overhang

{

  const k0 = key(Math.round(CX * S), topAt(Math.round(CX * S), Math.round((CZ + 12) * S)), Math.round((CZ + 12) * S));
  seen.add(k0); stack.push(V.get(k0));

  while (stack.length) {

    for (const [dx, dy, dz] of D) {

// (re)compute start times for ANIM.order and re-sort; called again when the UI changes the order or motion
function plan() {
  if (ANIM.order === 'scan') {
    // head rasters each layer in rows along z, alternating direction like a printer nozzle
    const nx = maxX - minX + 1, nz = maxZ - minZ + 1;
    for (const v of vox) {
      const row = v.z - minZ, along = row % 2 ? maxX - v.x : v.x - minX;
      v.t0 = (v.y - minY) * SCAN + (row + along / nx) / nz * SCAN * 0.9;
    }
  } else if (ANIM.order === 'stages') {
    // each stage builds bottom-up from its own lowest voxel; the next starts when this one is ~80% done
    const groups = new Map();
    for (const v of vox) (groups.get(v.st) || groups.set(v.st, []).get(v.st)).push(v);
    let start = 0;
    for (const s of [...groups.keys()].sort((a, b) => a - b)) {
      const g = groups.get(s), y0 = g.reduce((m, v) => Math.min(m, v.y), 1e9);
      let span = 0;
      for (const v of g) { const lt = layerT(v, y0); v.t0 = start + lt; span = Math.max(span, lt); }
      start += span * 0.8 + 0.3;
    }
  } else for (const v of vox) v.t0 = layerT(v, minY);
  vox.sort((a, b) => a.t0 - b.t0);
  DUR = DURS[ANIM.motion] ?? 0.55;
  BUILD_END = vox[COUNT - 1].t0 + DUR;
}

  const R = Math.cbrt(3 * N / (0.55 * Math.PI)) * 1.05, H = R * 0.55, cx = Math.round(CX * S), cz = Math.round(CZ * S);
  let n = 0;
  for (let y = 0; n < N; y++) {                         // cone layers; past the tip keep stacking a column
    const r = Math.max(1.5, R * (1 - y / H)), ring = [];
    for (let x = -Math.ceil(r); x <= Math.ceil(r); x++) for (let z = -Math.ceil(r); z <= Math.ceil(r); z++) {
      const d = Math.hypot(x, z) + (hash(x, z, y + 31) - 0.5) * 1.2;   // ragged outline
      if (d <= r) ring.push([x, z, d]);
    }
    ring.sort((a, b) => a[2] - b[2]);
    for (const [x, z] of ring) { if (n >= N) break; SX[n] = cx + x; SY[n] = topAt(cx + x, cz + z) + 1 + y; SZ[n] = cz + z; n++; }
  }
  for (const v of vox) setM(v, v.x, v.y, v.z, 1);      // also when triggered mid-build
  first = COUNT; if (doneAt < 0) doneAt = t;
  pileAt = t;
}
function pile(d) {                  // returns false when the heap has rebuilt the scene
  const N = PV.length, back = PILE.fall + PILE.fly + PILE.hold;
  if (d > back + PILE.rise + PILE.fly) return false;
  for (let j = 0; j < N; j++) {
    const v = vox[PV[j]], r = j / N;
    let a = (d - r * PILE.fall) / PILE.fly, fx = v.x, fy = v.y, fz = v.z, tx = SX[j], ty = SY[j], tz = SZ[j];
    if (d > back) { a = (d - back - (1 - r) * PILE.rise) / PILE.fly; [fx, fy, fz, tx, ty, tz] = [tx, ty, tz, fx, fy, fz]; }
    a = Math.max(0, Math.min(1, a));
    if (d > back && a === 0) { setM(v, SX[j], SY[j], SZ[j], 1); continue; }
    const e = easeInOutCubic(a), arc = Math.sin(Math.PI * e) * (4 * S + Math.hypot(tx - fx, tz - fz) * 0.35);
    setM(v, fx + (tx - fx) * e, fy + (ty - fy) * e + arc, fz + (tz - fz) * e, 1);
  }
  meshes.forEach(m => { m.instanceMatrix.needsUpdate = true; });
  return true;
}
// sky=night: dusk falls a couple of seconds after the build; glow and hero lights are pushed past 1 to stay bright
const nightDiv = document.getElementById('night'), DAY_HEMI = hemi.color.clone(), NIGHT_HEMI = new THREE.Color(0x8ea4d6);
let night = 0;
function setSky(dt) {
  const want = ANIM.sky === 'night' && doneAt >= 0 && demoAt < 0 && pileAt < 0 && t - doneAt > 2 ? 1 : 0;
  night += (want - night) * Math.min(1, dt * 0.45);
  nightDiv.style.opacity = night.toFixed(3);
  document.body.classList.toggle('dark', night > 0.5);
  hemi.intensity = HEMI_I * (1 - 0.72 * night);
  hemi.color.copy(DAY_HEMI).lerp(NIGHT_HEMI, night);
  sun.intensity = SUN_I * (1 - 0.88 * night);
  glassMat.envMapIntensity = 0.9 * (1 - 0.85 * night);          // the studio env's light bars read as things behind the glass at night
}
function setLights(k) {            // dim while building, full once complete
  warmLights.forEach(l => { l.intensity = l.userData.base * k; });
  glowMat.color.setScalar(0.35 + 0.65 * k);
  blendBake(Math.min(1, k));       // baked lamps are emissive: no night boost needed, the dark around them does it
}

const bar = document.querySelector('#bar i');
const loopBox = document.getElementById('loop');
document.getElementById('replay').onclick = reset;
const pauseBtn = document.getElementById('pause');
const togglePause = () => { paused = !paused; pauseBtn.textContent = paused ? 'Play (Space)' : 'Pause (Space)'; };
pauseBtn.onclick = togglePause;
addEventListener('keydown', e => {
  if (e.code === 'KeyR') reset();
  else if (e.code === 'KeyF') t = BUILD_END;
  else if (e.code === 'KeyD' && demoAt < 0 && pileAt < 0) startDemolish();
  else if (e.code === 'KeyP' && demoAt < 0 && pileAt < 0) startPile();
  else if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.code === 'KeyH') document.getElementById('ui').classList.toggle('hidden');
});
// detail (voxel subdivision) changes the whole grid, so it reloads the page with ?res=
const resSel = document.getElementById('res');
resSel.value = S;
resSel.onchange = () => { Q.set('res', resSel.value); location.search = '?' + Q; };
// animation mode pickers: replan + replay on change, and keep the URL in sync so the combination can be shared
for (const k in ANIM) {
  const sel = document.getElementById(k);
  sel.value = ANIM[k];
  sel.onchange = () => {
    ANIM[k] = sel.value;
    if (k === 'order' && sel.value === 'scan') ANIM.motion = document.getElementById('motion').value = 'grow';
    sel.blur();                        // keep Space/R/F going to the page, not the select
    if (k === 'order' || k === 'motion') { plan(); pose = POSE[ANIM.motion]; REL = null; restoreColours(); reset(); }
    else if (k === 'intro') reset();
    for (const j in ANIM) Q.set(j, ANIM[j]);
    history.replaceState(null, '', '?' + Q);
  };
}
window.__seeAz = az => { camAz = az; placeCamera(az); };   // frame any side when testing
window.__zoom = (z, x = 0, y = 4, zz = 0) => { cam.zoom = z; cam.updateProjectionMatrix(); controls.target.set(x, y, zz); };   // close-ups (world units)
window.__lamps = bakedLights;                                    // the lamps that made it into the bake
window.__hero = on => warmLights.forEach(l => { l.visible = on; });   // hero PointLights on/off for comparison
window.__bake = on => { bakeForce = on === undefined ? null : on ? 1 : 0; };   // force baked lamps on/off for comparison (no arg: auto)

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (!paused) {
    t += dt;
    if (demoAt >= 0) { if (!demolish(t - demoAt)) reset(); }
    else if (pileAt >= 0) { if (!pile(t - pileAt)) { for (const v of vox) setM(v, v.x, v.y, v.z, 1); meshes.forEach(m => { m.instanceMatrix.needsUpdate = true; }); pileAt = -1; doneAt = t; } }
    else if (first < COUNT) step();
    else if (doneAt < 0) doneAt = t;
    else if (loopBox.checked && t - doneAt > 30) ({ demolish: startDemolish, pile: startPile }[ANIM.outro] || reset)();   // long hold so a full orbit shows every side
    bar.style.width = Math.max(0, Math.min(100, (t / BUILD_END) * 100)) + '%';
    if (!userMoved && orbitBox.checked) { camAz += dt * 0.12; placeCamera(camAz); }
  }
  head.visible = ANIM.order === 'scan' && t >= 0 && first < COUNT && demoAt < 0;
  if (head.visible) head.position.y = minY + Math.min(maxY - minY, Math.floor(t / SCAN)) + 0.55;
  // blueprint: fade in during the lead-in, hold through the build, fade out once complete
  const bp = ANIM.intro !== 'blueprint' || demoAt >= 0 || pileAt >= 0 ? 0
    : t < 0 ? Math.min(1, (t + BLUEPRINT) / 0.8) : doneAt < 0 ? 1 : Math.max(0, 1 - (t - doneAt) / 1.2);
  ghost.visible = bp > 0; ghost.material.opacity = bp;
  setSky(dt);
  const out = demoAt >= 0 ? demoAt : pileAt;
  setLights((out >= 0 ? Math.max(0.15, 1 - (t - out) * 0.85)
    : doneAt < 0 ? 0.15 : 0.15 + 0.85 * Math.min(1, (t - doneAt) / 1.5)) * (1 + 1.2 * night));
  controls.update();
  renderer.render(scene, cam);
});
</script>
</body>
