<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// Voxel subdivision: each design unit is S×S×S small voxels. Override with ?res=1..4
const S = Math.max(1, Math.min(4, parseInt(new URLSearchParams(location.search).get('res')) || 3));

// =====================================================================================================
// ENGINE: helpers (keep as is)
// =====================================================================================================
function hash(x, z, s = 0) {

}
function vnoise(x, z, sc, s = 0) {

  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);

// Fine-grid voxel store; e = false (lit), true (glowing), 'glass' (semi-transparent).
// The +256 key offset matters: the island underside goes to negative y.
const V = new Map();
const key = (x, y, z) => ((x + 256) * 1024 + (y + 256)) * 1024 + (z + 256);

let TAG = 0;
const fset = (x, y, z, c, e = false) => V.set(key(x, y, z), { x, y, z, c, e, g: TAG });

const fhas = (x, y, z) => V.has(key(x, y, z));

const col = (c, x, y, z) => typeof c === 'function' ? c(x, y, z) : Array.isArray(c) ? c[Math.floor(hash(x * 7 + y, z, 3) * c.length)] : c;
function fbox(x0, y0, z0, x1, y1, z1, c, e = false) {

}
const box = (x0, y0, z0, x1, y1, z1, c, e) => fbox(x0 * S, y0 * S, z0 * S, x1 * S + S - 1, y1 * S + S - 1, z1 * S + S - 1, c, e);

  const X0 = x0 * S, X1 = x1 * S + S - 1, Y0 = y0 * S, Y1 = y1 * S + S - 1, Z0 = z0 * S, Z1 = z1 * S + S - 1;
  for (let x = X0; x <= X1; x++) for (let y = Y0; y <= Y1; y++) for (let z = Z0; z <= Z1; z++)

}
// plane helpers: axis 'x' = wall at fixed fine z (a runs along x), 'z' = wall at fixed fine x (a runs along z)
const pset = (axis, a, y, l, c, e) => axis === 'x' ? fset(a, y, l, c, e) : fset(l, y, a, c, e);

function disc(cx, cz, r0, r1, fy0, fy1, c, e) {        // ring/disc, design centre + radii, fine y range

    for (let fz = Math.floor((cz - r1 - 1) * S); fz <= Math.ceil((cz + r1 + 1) * S); fz++) {
      const d = Math.hypot(dc(fx) - cx, dc(fz) - cz);

    }
}
function blob(cx, cy, cz, r, pal, sy = 1, rough = 0.6, e = false) {   // noisy ellipsoid (leaves, bushes, smoke)
  const R = r + 1;
  for (let fx = Math.floor((cx - R) * S); fx <= Math.ceil((cx + R) * S); fx++)
    for (let fy = Math.floor((cy - R * sy) * S); fy <= Math.ceil((cy + R * sy) * S); fy++)
      for (let fz = Math.floor((cz - R) * S); fz <= Math.ceil((cz + R) * S); fz++) {

// face-connected line between two design points (trunks, branches, poles): steps one axis at a time

  const put = (fx, fy, fz) => { for (let a = 0; a < thick; a++) for (let b = 0; b < thick; b++) fset(fx + a, fy, fz + b, col(pal, fx + a, fy, fz + b)); };

    while (pz !== fz) { pz += Math.sign(fz - pz); put(px, py, pz); }

// =====================================================================================================
// SCENE: palette, ground, buildings, props (replace with your scene)
// =====================================================================================================
// Scale: this is not a house, so the house scale table does not apply. 1 design unit ≈ 1.2 m, proportions taken
// from the photo (ship nose ≈ 112 units above the pad, tower ≈ 117, rocket diameter 9, tower 11 square).
const P = {
  lawn: [0x58603f, 0x4f5838, 0x626a46],                // coastal scrub grass at dusk
  lawnDry: [0x86805e, 0x7a7656],
  topsoil: [0x4a3f30, 0x40362a],
  under: [0x7c776c, 0x6d685e, 0x5f5a51, 0x524e46],
  concrete: [0x9a958f, 0x928d87, 0xa29d96],
  joint: 0x7a756f,
  scorch: [0x6e6760, 0x76706a, 0x625c56],
  gravel: [0x8f8a82, 0x857f78, 0x99938a],
  water: [0x3c4652, 0x46505c, 0x414b57],
  waterHi: [0x8f8486, 0x7d7579],                       // fire glow reflected on the lagoon
  steel: [0x6e7484, 0x676d7d, 0x737a8a],               // tower lattice (sampled #414756 / #333847)
  steelHi: [0x80869a, 0x8a90a2],
  olm: [0x6a6c74, 0x5e6068, 0x74767c],
  frost: [0xebe7df, 0xe1ddd5, 0xf2eee6, 0xd9d4cb],     // frosted booster, lit warm by the flames
  bsteel: [0xaaa7aa, 0x9f9ca0, 0xb3b0b2],
  ssteel: [0xa9a5ab, 0x9e9aa2, 0xb2aeb3],              // ship stainless
  tile: [0x2f2c33, 0x37343b, 0x2a282e, 0x3d3a41],      // heat-shield tiles
  smoke: [0xe2dedc, 0xd8d4d3, 0xcdc8c8, 0xeae6e2],
  tank: [0xd2d0ce, 0xc6c4c4, 0xdad8d6],
  shrub: [0x3f4c35, 0x48563b, 0x52603f, 0x394531],
  palm: [0x4d5e33, 0x58693a, 0x44552e],
  weed: [0x55603a, 0x6a7343, 0x46522f, 0x7d8450],
  litter: [0x7a6a44, 0x6f6440, 0x5f6038],
  bark: [0x5a4c3c, 0x4d4033],
  trim: 0xd4cfc6,
  black: 0x1e1e22,
  roof: [0x5a5550], roofCap: 0x44403c, leaf: [0x48563b],

const GLOW = 0xffd27a;
const GLASS = 0x5f9cc4;
const RED = 0xff3020;
const FLAME = [0xfffdf2, 0xfff6cc, 0xffe7a0, 0xffd07a, 0xffb45a, 0xff9a48];

const CX = 50, CZ = 50;            // island centre (design units)

const F = v => Math.round(v * S);                       // design -> fine (box-style, like limb)
const fi = v => Math.round(v * S + (S - 1) / 2);        // continuous design position -> nearest fine cell

// key layout (design units)
const RX = 56, RZ = 50, RR = 4.5;                       // rocket axis and radius
const RB = GY + 16, HS0 = GY + 66, SH0 = GY + 68, NOSE0 = GY + 102, NOSE1 = GY + 113;
const TWX0 = 35, TWX1 = 46, TWZ0 = 45, TWZ1 = 56, TWTOP = GY + 117;   // tower footprint [x0, x1) and top
const ARMY0 = GY + 99, ARMY1 = GY + 107;                // chopstick carriage
const QDY = GY + 70;                                    // ship quick-disconnect arm
// regions on the ground
const apron = (x, z) => ((x - 55) / 28) ** 4 + ((z - 50) / 16) ** 4 + (vnoise(x, z, 4, 31) - 0.5) * 0.3 < 1;

  || (Math.abs(z - 33 - (vnoise(x, 0, 8, 34) - 0.5) * 2) < 2 && x > 18 && x < 47);

// ---------- island: irregular lobed outline, rounded rim bumps, one iceberg rock mass underneath ----------
const ISLAND = 7;

function edgeR(x, z) {

  const u = (th / (2 * Math.PI) + 0.5) * K + (vnoise(th * 4 + 9, 3, 1, 8) - 0.5) * 0.5;
  const k = Math.floor(u), f = u - k, bump = Math.sin(Math.PI * f) ** 2;

  const ragged = (vnoise(x, z, 9, 62 + ISLAND) - 0.5) * 5 + (vnoise(x, z, 3.5, 63) - 0.5) * 1.6;

const botAt = (fx, fz) => inGrid(fx, fz) ? bottom[idx(fx, fz)] : OUT;
const topAt = (fx, fz) => inGrid(fx, fz) ? top[idx(fx, fz)] : -OUT;

  const x = dc(fx), z = dc(fz);
  const e = edgeE(x, z);
  if (e < 0) continue;
  top[idx(fx, fz)] = TOP - 1 + Math.round(heightAt(x, z) * S);
  const ra = Math.min(1, Math.hypot(x - CX - 3, z - CZ + 2) / 58);
  const facet = (Math.floor(vnoise(x, z, 7, 51) * 5) / 5 - 0.4) * 6;

function surfaceC(x, z, fx, fz) {

    const d = Math.hypot(x - RX, z - RZ);
    if (d < 15 && vnoise(x, z, 3, 37) + (15 - d) / 30 > 0.75) return pick(P.scorch);                  // scorch fan
    if (((fx % (5 * S)) + 5 * S) % (5 * S) === 0 || ((fz % (5 * S)) + 5 * S) % (5 * S) === 0) return P.joint;   // slab joints

TAG = 4;
for (let fx = LO; fx < LO + WD; fx++) for (let fz = LO; fz < LO + WD; fz++) {
  const b = botAt(fx, fz);

  for (let fy = b; fy <= t; fy++) {
    if (fy !== b && fy !== t && nb.every(([nbot, ntop]) => nbot < fy && ntop > fy)) continue;

TAG = 0;

// ---------- generic parts ----------
const tmp = new THREE.Color();

      if (i === first) first++;
    } else {
      const s = Math.max(0, easeOutBack(Math.min(1, p * 1.25)));
      setM(v, v.x, v.y + (1 - easeOutCubic(p)) * DROP, v.z, s);
    }
    i++;
  }
  meshes.forEach(m => { m.instanceMatrix.needsUpdate = true; });
}
function setLights(k) {            // dim while building, full once complete
  warmLights.forEach(l => { l.intensity = l.userData.base * k; });
  glowMat.color.setScalar(0.35 + 0.65 * k);
  bloom.strength = 0.08 + 0.5 * k;
  blendBake(k);
}

const bar = document.querySelector('#bar i');
const loopBox = document.getElementById('loop');
document.getElementById('replay').onclick = reset;
const pauseBtn = document.getElementById('pause');
const togglePause = () => { paused = !paused; pauseBtn.textContent = paused ? 'Play (Space)' : 'Pause (Space)'; };
pauseBtn.onclick = togglePause;
addEventListener('keydown', e => {
  if (e.code === 'KeyR') reset();
  else if (e.code === 'KeyF') t = BUILD_END;
  else if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.code === 'KeyH') document.getElementById('ui').classList.toggle('hidden');
});
window.__seeAz = az => { camAz = az; placeCamera(az); };   // frame any side when testing
window.__zoom = (z, x = 0, y = 4, zz = 0) => { cam.zoom = z; cam.updateProjectionMatrix(); controls.target.set(x, y, zz); };   // close-ups (world units)
window.__bake = on => { bakeForce = on === undefined ? null : on ? 1 : 0; };   // force baked lamps on/off for comparison (no arg: auto)

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (!paused) {
    t += dt;
    if (first < COUNT) step();
    else if (doneAt < 0) doneAt = t;
    else if (loopBox.checked && t - doneAt > 30) reset();     // long hold so a full orbit shows every side
    bar.style.width = Math.min(100, (t / BUILD_END) * 100) + '%';
    if (!userMoved && orbitBox.checked) { camAz += dt * 0.12; placeCamera(camAz); }
  }
  setLights(doneAt < 0 ? 0.15 : 0.15 + 0.85 * Math.min(1, (t - doneAt) / 1.5));
  controls.update();
  if (innerWidth && innerHeight) composer.render();       // a hidden pane has zero size
});
</script>
