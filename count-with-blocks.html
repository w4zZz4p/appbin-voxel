<title>Count with Blocks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: one full-screen sky stage; brand chip top-left; big spoken word, number dots and controls along the bottom */
:root {
  --sky-top: #79c6ff;
  --sky-bottom: #ffe2f0;
  --ink: #2c2960;
  --ink-soft: #6a66a8;
  --card: rgba(255, 255, 255, 0.86);
  --card-edge: rgba(44, 41, 96, 0.12);
  --num: #ff5d73;
  --display: "Baloo 2", "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--sky-bottom); color: var(--ink); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; background: linear-gradient(180deg, var(--sky-top) 0%, #bfe3ff 45%, var(--sky-bottom) 100%); }
#stage canvas { display: block; width: 100%; height: 100%; }

.ui {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
}
.brand {
  display: inline-flex; align-items: center; gap: 10px; align-self: flex-start;
  background: var(--card); border: 1px solid var(--card-edge); border-radius: 14px;
  padding: 8px 14px 8px 10px; backdrop-filter: blur(6px);
}
.cube { width: 26px; height: 26px; position: relative; flex: none; }
.cube i { position: absolute; width: 12px; height: 12px; border-radius: 2px; }
.cube i:nth-child(1) { left: 0; top: 14px; background: #ff5d73; }
.cube i:nth-child(2) { left: 14px; top: 14px; background: #ffd23f; }
.cube i:nth-child(3) { left: 7px; top: 0; background: #4da3ff; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1; margin: 0; letter-spacing: 0.2px; }
.brand p { margin: 2px 0 0; font-size: 11px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 1.2px; }

.bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.caption { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.word {
  font-family: var(--display); font-weight: 800; line-height: 1;
  font-size: clamp(44px, 9vw, 92px); color: var(--num);
  text-shadow: 0 4px 0 #fff, 0 8px 0 rgba(44, 41, 96, 0.18);
  min-height: 1em; text-wrap: balance;
  transition: color 0.4s ease;
}
.word.pop { animation: pop 0.5s cubic-bezier(0.3, 1.7, 0.5, 1); }
@keyframes pop { 0% { transform: scale(0.6) translateY(10px); opacity: 0.2; } 100% { transform: none; opacity: 1; } }
.hint {
  font-weight: 800; font-size: clamp(15px, 2.2vw, 19px); color: var(--ink);
  background: var(--card); border: 1px solid var(--card-edge); border-radius: 999px; padding: 6px 16px;
}

.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; pointer-events: auto; }
.dot {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--card-edge);
  background: var(--card); color: var(--ink-soft); font: 800 15px/1 var(--display);
  cursor: pointer; display: grid; place-items: center; padding: 0; padding-top: 2px;
  transition: transform 0.2s ease, background 0.3s ease, color 0.3s ease;
  font-variant-numeric: tabular-nums;
}
.dot:hover { transform: translateY(-2px); }
.dot.done { color: var(--ink); }
.dot.on { background: var(--c, var(--num)); color: #fff; border-color: #fff; transform: scale(1.12); }

.controls { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
.btn {
  height: 44px; min-width: 44px; border-radius: 14px; border: 1px solid var(--card-edge);
  background: var(--card); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 800 15px var(--body); padding: 0 14px; box-shadow: 0 3px 0 rgba(44, 41, 96, 0.15);
  transition: transform 0.15s ease;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(44, 41, 96, 0.15); }
.btn svg { width: 20px; height: 20px; fill: currentColor; }
.btn.primary { background: var(--ink); color: #fff; min-width: 64px; }
.btn[aria-pressed="true"] { background: #fff3b0; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

@media (max-width: 480px) {
  .dot { width: 30px; height: 30px; font-size: 13px; }
  .brand h1 { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .word.pop { animation: none; }
  .dot, .btn, .word { transition: none; }
}
</style>

<div id="stage"></div>
<div class="ui">
  <div class="brand">
    <span class="cube" aria-hidden="true"><i></i><i></i><i></i></span>
    <div><h1>Count with Blocks</h1><p>Numbers 1 to 10</p></div>
  </div>
  <div class="bottom">
    <div class="caption" aria-live="polite">
      <div id="word" class="word">&nbsp;</div>
      <div id="hint" class="hint">Let's count!</div>
    </div>
    <nav id="dots" class="dots" aria-label="Pick a number"></nav>
    <div class="controls">
      <button id="prev" class="btn" aria-label="Previous number"><svg viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5 1.9-1.9L11.8 12l5.6-5.6z"/></svg></button>
      <button id="play" class="btn primary" aria-label="Pause"><svg viewBox="0 0 24 24"><path id="playIcon" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <button id="next" class="btn" aria-label="Next number"><svg viewBox="0 0 24 24"><path d="M8.5 4.5 16 12l-7.5 7.5-1.9-1.9 5.6-5.6-5.6-5.6z"/></svg></button>
      <button id="sound" class="btn" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="waves" d="M16 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2zM18.5 6a8.5 8.5 0 0 1 0 12l-1.4-1.4a6.5 6.5 0 0 0 0-9.2z" opacity="0.3"/></svg><span id="soundLabel">Sound on</span></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- data ----------
  const WORDS = ["one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
  const NUM_COLORS = ["#ff5d73", "#ff9f43", "#f7c51e", "#5cc95a", "#2fbfb8", "#4da3ff", "#7f6dff", "#b86bff", "#ff6fb0", "#ff6f3c"];
  const PAL = { r: 0xff4d5e, w: 0xffffff, g: 0x58c94a, b: 0x8a5a3b, y: 0xffd23f, p: 0xff7eb6, c: 0x45bdfc, k: 0x2c2960, m: 0xc77dff, Y: 0xffe066 };
  const MODELS = [
    { name: ["apple", "apples"], rows: ["...bg..", ".rrbrr.", "rwrrrrr", "rrrrrrr", "rrrrrrr", ".rrrrr.", "..r.r.."] },
    { name: ["star", "stars"], rows: ["...y...", "..yyy..", "yyyyyyy", ".yyyyy.", "..yyy..", ".yy.yy.", ".y...y."] },
    { name: ["heart", "hearts"], rows: [".pp.pp.", "pwppppp", "ppppppp", "ppppppp", ".ppppp.", "..ppp..", "...p..."] },
    { name: ["fish", "fish"], rows: ["..ccc...", ".ccccc.c", "ckcccccc", ".ccccc.c", "..ccc..."] },
    { name: ["flower", "flowers"], rows: ["..mmm..", ".mmYmm.", "..mmm..", "...g...", ".g.g...", "..ggg..", "...g..."] },
  ];
  const FONT = {
    0: ["111", "101", "101", "101", "111"], 1: ["010", "110", "010", "010", "111"],
    2: ["111", "001", "111", "100", "111"], 3: ["111", "001", "111", "001", "111"],
    4: ["101", "101", "111", "001", "001"], 5: ["111", "100", "111", "001", "111"],
    6: ["111", "100", "111", "101", "111"], 7: ["111", "001", "010", "010", "010"],
    8: ["111", "101", "111", "101", "111"], 9: ["111", "101", "111", "001", "111"],
  };

  // seeded random so the island looks the same every visit
  let seed = 7;
  const rand = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  // ---------- renderer ----------
  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xffe2f0, 30, 70);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);

  scene.add(new THREE.HemisphereLight(0xffffff, 0xc9b8ff, 0.58));
  const sun = new THREE.DirectionalLight(0xfff4e2, 0.62);
  sun.position.set(5, 9, 12);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 50 });
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  // ---------- shaders: rim light, sky dome ----------
  // warm backlit edge on every voxel, injected into the stock Lambert shader
  function addRim(mat, strength) {
    mat.onBeforeCompile = (sh) => {
      const decl = "#include <common>\nvarying vec3 vRimN;\nvarying vec3 vRimV;";
      sh.vertexShader = sh.vertexShader
        .replace("#include <common>", decl)
        .replace("#include <project_vertex>", "#include <project_vertex>\nvRimN = normalize(transformedNormal);\nvRimV = -mvPosition.xyz;");
      sh.fragmentShader = sh.fragmentShader
        .replace("#include <common>", decl)
        .replace("#include <dithering_fragment>",
          "float rimF = pow(1.0 - clamp(dot(normalize(vRimN), normalize(vRimV)), 0.0, 1.0), 2.5);\n" +
          "gl_FragColor.rgb += vec3(1.0, 0.92, 0.84) * rimF * " + strength.toFixed(2) + ";\n#include <dithering_fragment>");
    };
  }

  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uTime: { value: 0 },
      uTop: { value: new THREE.Color(0x5bb4ff) },
      uMid: { value: new THREE.Color(0xa9d9ff) },
      uBottom: { value: new THREE.Color(0xffe2f0) },
      uSunDir: { value: new THREE.Vector3(0.55, 0.38, -1).normalize() },
    },
    vertexShader: `
      varying vec3 vDir;
      void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float uTime; uniform vec3 uTop, uMid, uBottom, uSunDir;
      varying vec3 vDir;
      void main() {
        vec3 d = normalize(vDir);
        float h = d.y;
        vec3 col = h > 0.04 ? mix(uMid, uTop, smoothstep(0.04, 0.55, h)) : mix(uBottom, uMid, smoothstep(-0.25, 0.04, h));
        float s = max(dot(d, uSunDir), 0.0);
        col += vec3(1.0, 0.95, 0.8) * (pow(s, 120.0) * 0.8 + pow(s, 14.0) * 0.12);
        vec3 side = normalize(cross(uSunDir, vec3(0.0, 1.0, 0.0)));
        float ang = atan(dot(d, side), d.y - uSunDir.y);
        float rays = 0.5 + 0.5 * sin(ang * 16.0 + uTime * 0.35) * sin(ang * 7.0 - uTime * 0.2);
        col += vec3(1.0, 0.9, 0.82) * rays * pow(s, 6.0) * 0.08;
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(90, 32, 20), skyMat));

  // ---------- voxel geometry merging ----------
  const BOX = new THREE.BoxGeometry(1, 1, 1).toNonIndexed();
  const BP = BOX.attributes.position.array, BN = BOX.attributes.normal.array, BV = BP.length / 3;
  function merge(vox) {
    const n = vox.length, pos = new Float32Array(n * BV * 3), nor = new Float32Array(n * BV * 3), col = new Float32Array(n * BV * 3);
    vox.forEach((v, i) => {
      const o = i * BV * 3;
      for (let j = 0; j < BV; j++) {
        const k = j * 3;
        pos[o + k] = BP[k] * v.s + v.x; pos[o + k + 1] = BP[k + 1] * v.s + v.y; pos[o + k + 2] = BP[k + 2] * v.s + v.z;
        nor[o + k] = BN[k]; nor[o + k + 1] = BN[k + 1]; nor[o + k + 2] = BN[k + 2];
        col[o + k] = v.c.r; col[o + k + 1] = v.c.g; col[o + k + 2] = v.c.b;
      }
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
    g.setAttribute("color", new THREE.BufferAttribute(col, 3));
    g.computeBoundingSphere();
    return g;
  }
  const tint = (hex, j = 0.05) => new THREE.Color(hex).offsetHSL(0, 0, (rand() - 0.5) * j);
  const vcMat = new THREE.MeshLambertMaterial({ vertexColors: true });
  addRim(vcMat, 0.28);
  const islandMat = new THREE.MeshLambertMaterial({ vertexColors: true });
  addRim(islandMat, 0.08);

  // ---------- island ----------
  (function buildIsland() {
    const C = 0.5, vox = [];
    const RX = 8.4, RZ = 3.8;
    for (let layer = 0; layer < 6; layer++) {
      const shrink = 1 - layer * 0.16;
      for (let x = -RX; x <= RX; x += C) {
        for (let z = -RZ; z <= RZ; z += C) {
          const d = (x / (RX * shrink)) ** 2 + (z / (RZ * shrink)) ** 2;
          if (d > 1 - rand() * 0.08 * layer) continue;
          const y = -C / 2 - layer * C;
          const hex = layer === 0 ? (rand() < 0.5 ? 0x7edb5c : 0x6fcf52) : layer < 3 ? (rand() < 0.5 ? 0xd0915e : 0xc2804f) : 0xa98a7c;
          vox.push({ x, y, z, s: C, c: tint(hex, 0.06) });
          if (layer === 0 && rand() < 0.08 && Math.abs(x) > 4.5) vox.push({ x, y: 0.08, z, s: 0.16, c: tint(rand() < 0.5 ? 0xffffff : 0xffe066, 0.02) });
        }
      }
    }
    // two trees
    for (const tx of [-6.4, 6.6]) {
      const tz = -1.9;
      for (let h = 0; h < 4; h++) vox.push({ x: tx, y: 0.2 + h * 0.4, z: tz, s: 0.4, c: tint(0x9a6440) });
      for (let x = -3; x <= 3; x++) for (let y = -2; y <= 3; y++) for (let z = -3; z <= 3; z++) {
        if (x * x + (y * 1.2) ** 2 + z * z > 8.5 + rand() * 2) continue;
        vox.push({ x: tx + x * 0.4, y: 2.4 + y * 0.4, z: tz + z * 0.4, s: 0.4, c: tint(rand() < 0.5 ? 0x5ec95b : 0x4fb84e, 0.07) });
      }
    }
    const mesh = new THREE.Mesh(merge(vox), islandMat);
    mesh.receiveShadow = true; mesh.castShadow = true;
    scene.add(mesh);
  })();

  // ---------- clouds ----------
  const cloudMat = new THREE.MeshLambertMaterial({ vertexColors: true, emissive: 0x5a5a70 });
  addRim(cloudMat, 0.18);
  const clouds = [];
  for (let i = 0; i < 5; i++) {
    const vox = [], S = 0.6;
    const len = 3 + Math.floor(rand() * 4);
    for (let x = -len; x <= len; x++) for (let y = 0; y < 3; y++) for (let z = -1; z <= 1; z++) {
      const r = (x / len) ** 2 + (y / 2.4) ** 2 + (z / 1.6) ** 2;
      if (r < 1 - rand() * 0.25) vox.push({ x: x * S, y: y * S, z: z * S, s: S, c: tint(0xffffff, 0.02) });
    }
    const m = new THREE.Mesh(merge(vox), cloudMat);
    m.position.set(-22 + i * 10 + rand() * 3, 6 + rand() * 4, -12 - rand() * 8);
    clouds.push({ m, speed: 0.25 + rand() * 0.3 });
    scene.add(m);
  }

  // ---------- springs ----------
  const sp = (v) => ({ v, vel: 0, t: v });
  function step(s, k, d, dt) { s.vel += (k * (s.t - s.v) - d * s.vel) * dt; s.v += s.vel * dt; }
  const damp = (k, bouncy) => (reduceMotion ? 2 * Math.sqrt(k) : bouncy * Math.sqrt(k));

  // ---------- big voxel number ----------
  const DS = 0.46, DY = 2.9, DZ = -2.5;
  const digitGroup = new THREE.Group();
  scene.add(digitGroup);
  const digitGeo = new THREE.BoxGeometry(DS * 0.94, DS * 0.94, DS * 0.94);
  const digitVox = [];
  for (let i = 0; i < 24; i++) {
    const mat = new THREE.MeshLambertMaterial({ color: NUM_COLORS[0] });
    addRim(mat, 0.5);
    const mesh = new THREE.Mesh(digitGeo, mat);
    mesh.castShadow = true;
    mesh.scale.setScalar(0.0001);
    digitGroup.add(mesh);
    digitVox.push({ mesh, x: sp(0), y: sp(DY + 1), z: sp(DZ), s: sp(0), color: new THREE.Color(NUM_COLORS[0]), ct: new THREE.Color(NUM_COLORS[0]), k: 70 + rand() * 50 });
  }
  function setDigits(str, colorHex) {
    const cells = [];
    if (str) {
      const W = str.length * 4 - 1;
      [...str].forEach((ch, di) => FONT[ch].forEach((row, ry) => [...row].forEach((b, cx) => {
        if (b === "1") cells.push([(di * 4 + cx - (W - 1) / 2) * DS, DY + (4 - ry) * DS]);
      })));
    }
    digitVox.forEach((d, i) => {
      if (i < cells.length) {
        if (d.s.v < 0.05) { d.x.v = cells[i][0]; d.y.v = cells[i][1] + 0.6; d.z.v = DZ + 1.5; }
        d.x.t = cells[i][0]; d.y.t = cells[i][1]; d.z.t = DZ; d.s.t = 1;
        d.ct.set(colorHex);
      } else {
        d.s.t = 0; d.y.t = d.y.v + 0.8;
      }
    });
  }

  // ---------- counted objects ----------
  const modelGeos = MODELS.map(({ rows }) => {
    const px = 0.22, h = rows.length, w = Math.max(...rows.map((r) => r.length)), vox = [];
    rows.forEach((row, ry) => [...row].forEach((ch, cx) => {
      if (ch === ".") return;
      for (let d = 0; d < 2; d++) vox.push({ x: (cx - (w - 1) / 2) * px, y: (h - 1 - ry) * px + px / 2, z: (d - 0.5) * px, s: px, c: tint(PAL[ch], 0.06) });
    }));
    return merge(vox);
  });
  let objects = [];
  function slotsFor(n) {
    const gap = 1.75, slots = [];
    const row = (count, z) => { for (let i = 0; i < count; i++) slots.push([(i - (count - 1) / 2) * gap, z]); };
    if (n <= 5) row(n, 0.4); else { row(5, -0.9); row(n - 5, 1.1); }
    return slots;
  }
  function spawn(modelIndex, slot, index, onLand) {
    const mesh = new THREE.Mesh(modelGeos[modelIndex], vcMat);
    mesh.castShadow = true;
    mesh.scale.setScalar(0.0001);
    scene.add(mesh);
    const s = sp(0); s.t = 1;
    const r = sp(reduceMotion ? 0 : Math.PI * 2); r.t = 0;
    objects.push({ mesh, x: slot[0], z: slot[1], y: 6.5, vy: 0, s, sq: sp(1), r, landed: false, exiting: false, exitAt: null, phase: index * 0.7, onLand });
  }
  function exitObjects() {
    objects.forEach((o, i) => { if (o.exitAt === null) o.exitAt = simTime + i * 0.07; });
  }
  function hopAll() {
    objects.forEach((o, i) => at(i * 0.09, () => { if (!o.exiting) { o.vy = reduceMotion ? 3 : 7; o.r.vel += reduceMotion ? 0 : 14; } }));
  }

  // ---------- confetti ----------
  const confetti = [];
  const cGeo = new THREE.BoxGeometry(0.17, 0.17, 0.17);
  for (let i = 0; i < 70; i++) {
    const mesh = new THREE.Mesh(cGeo, new THREE.MeshLambertMaterial({ color: NUM_COLORS[i % NUM_COLORS.length] }));
    mesh.visible = false;
    scene.add(mesh);
    confetti.push({ mesh, p: new THREE.Vector3(), v: new THREE.Vector3(), spin: new THREE.Vector3(rand() * 8, rand() * 8, rand() * 8), life: 0 });
  }
  function burst() {
    if (reduceMotion) return;
    confetti.forEach((c) => {
      c.p.set((Math.random() - 0.5) * 2.5, DY + 1.2, DZ + 0.6);
      c.v.set((Math.random() - 0.5) * 10, 5 + Math.random() * 6, Math.random() * 5 - 0.5);
      c.life = 2.2 + Math.random();
      c.mesh.visible = true;
    });
  }

  // ---------- twinkling sparkles (point shader) ----------
  const SPARKS = 140;
  const sPos = new Float32Array(SPARKS * 3), sSeed = new Float32Array(SPARKS), sCol = new Float32Array(SPARKS * 3);
  for (let i = 0; i < SPARKS; i++) {
    sPos.set([(rand() - 0.5) * 20, -1.5, -6 + rand() * 9], i * 3);
    sSeed[i] = rand();
    const c = new THREE.Color(rand() < 0.5 ? 0xffffff : NUM_COLORS[i % NUM_COLORS.length]);
    sCol.set([c.r, c.g, c.b], i * 3);
  }
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute("position", new THREE.BufferAttribute(sPos, 3));
  sparkGeo.setAttribute("aSeed", new THREE.BufferAttribute(sSeed, 1));
  sparkGeo.setAttribute("aCol", new THREE.BufferAttribute(sCol, 3));
  const sparkMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uPx: { value: renderer.getPixelRatio() } },
    vertexShader: `
      attribute float aSeed; attribute vec3 aCol;
      uniform float uTime; uniform float uPx;
      varying float vTw; varying vec3 vCol;
      void main() {
        vec3 p = position;
        float m = mod(uTime * 0.35 * (0.5 + aSeed) + aSeed * 10.0, 9.0);
        p.y += m;
        p.x += sin(uTime * 0.5 + aSeed * 6.28) * 0.5;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vTw = (0.35 + 0.65 * (0.5 + 0.5 * sin(uTime * 3.0 + aSeed * 40.0))) * smoothstep(0.0, 1.5, m) * smoothstep(9.0, 6.5, m);
        vCol = aCol;
        gl_PointSize = uPx * 9.0 * (0.6 + vTw) * (14.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying float vTw; varying vec3 vCol;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        float d = length(c);
        float star = max(0.0, 1.0 - abs(c.x * c.y) * 80.0) * (1.0 - smoothstep(0.05, 0.5, d));
        float core = 1.0 - smoothstep(0.0, 0.16, d);
        float a = (star * 0.7 + core) * vTw;
        if (a < 0.01) discard;
        gl_FragColor = vec4(vCol * a + vec3(core * 0.6 * vTw), a);
      }`,
  });
  scene.add(new THREE.Points(sparkGeo, sparkMat));

  // ---------- post-processing: tilt-shift, glow, grade, vignette ----------
  const MSRT = renderer.capabilities.isWebGL2 && THREE.WebGLMultisampleRenderTarget;
  const sceneRT = MSRT ? new THREE.WebGLMultisampleRenderTarget(1, 1) : new THREE.WebGLRenderTarget(1, 1);
  const postMat = new THREE.ShaderMaterial({
    depthTest: false, depthWrite: false,
    uniforms: { tScene: { value: sceneRT.texture }, uRes: { value: new THREE.Vector2(1, 1) } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
      uniform sampler2D tScene; uniform vec2 uRes;
      varying vec2 vUv;
      vec3 tex(vec2 uv) { return texture2D(tScene, uv).rgb; }
      void main() {
        vec2 uv = vUv, px = 1.0 / uRes;
        vec3 col = tex(uv);
        // tilt-shift: sharp band through the island and number, soft above and below
        float blur = smoothstep(0.24, 0.55, abs(uv.y - 0.56)) * 4.5 * (uRes.y / 1000.0);
        if (blur > 0.05) {
          vec3 acc = col;
          for (int i = 0; i < 12; i++) {
            float a = float(i) * 0.5236;
            acc += tex(uv + vec2(cos(a), sin(a)) * px * blur * (1.0 + mod(float(i), 2.0)));
          }
          col = acc / 13.0;
        }
        // soft glow from bright highlights
        vec3 glow = vec3(0.0);
        for (int i = 0; i < 8; i++) {
          float a = float(i) * 0.785 + 0.3;
          glow += max(tex(uv + vec2(cos(a), sin(a)) * px * 10.0 * (uRes.y / 1000.0)) - 0.92, 0.0);
        }
        col += glow * 0.18;
        // grade: a touch of extra saturation and a warm lift
        float l = dot(col, vec3(0.299, 0.587, 0.114));
        col = mix(vec3(l), col, 1.05) * vec3(1.015, 1.0, 0.985) + vec3(0.006, 0.0, 0.012);
        // vignette
        vec2 q = uv - 0.5; q.x *= uRes.x / uRes.y;
        col *= mix(1.0, 0.84, smoothstep(0.4, 1.0, length(q)));
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const postScene = new THREE.Scene();
  const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

  // ---------- sound ----------
  let audio = null, soundOn = false;
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
  function tone(freq, when, dur, vol) {
    if (!soundOn || !audio) return;
    const t = audio.currentTime + when, o = audio.createOscillator(), g = audio.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(freq * 1.5, t);
    o.frequency.exponentialRampToValueAtTime(freq, t + 0.07);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const pop = (i) => tone(392 * Math.pow(2, SCALE[i] / 12), 0, 0.35, 0.22);
  const fanfare = (n) => [0, 4, 7, 12].forEach((s, j) => tone(523 * Math.pow(2, (s + SCALE[n - 1] / 3) / 12), j * 0.1, 0.4, 0.16));
  function speak(text) {
    if (!soundOn) return;
    try {
      const synth = window.speechSynthesis;
      if (!synth) return;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.9; u.pitch = 1.25;
      synth.speak(u);
    } catch (e) { /* speech is optional */ }
  }

  // ---------- captions & dots ----------
  const wordEl = document.getElementById("word"), hintEl = document.getElementById("hint"), dotsEl = document.getElementById("dots");
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  function setWord(text, color) {
    wordEl.textContent = text || " ";
    if (color) wordEl.style.setProperty("--num", color);
    wordEl.classList.remove("pop"); void wordEl.offsetWidth; wordEl.classList.add("pop");
  }
  const dots = WORDS.map((w, i) => {
    const b = document.createElement("button");
    b.className = "dot"; b.id = "dot-" + (i + 1); b.textContent = i + 1;
    b.setAttribute("aria-label", "Count to " + w);
    b.style.setProperty("--c", NUM_COLORS[i]);
    b.addEventListener("click", () => go(i + 1));
    dotsEl.appendChild(b);
    return b;
  });
  function updateDots(n) {
    dots.forEach((b, i) => { b.classList.toggle("on", i + 1 === n); b.classList.toggle("done", i + 1 < n); });
  }

  // ---------- timeline ----------
  let simTime = 0, queue = [], playing = true, chapter = 1;
  function at(delay, fn) { queue.push({ t: simTime + delay, fn }); queue.sort((a, b) => a.t - b.t); }
  function startChapter(n) {
    queue = [];
    exitObjects();
    chapter = n;
    const mi = (n - 1) % MODELS.length, m = MODELS[mi];
    setDigits("", NUM_COLORS[0]);
    setWord("", NUM_COLORS[n - 1]);
    hintEl.textContent = n === 1 ? `Let's count one ${m.name[0]}!` : `Let's count the ${m.name[1]}!`;
    updateDots(n);
    const slots = slotsFor(n), gap = 0.95, first = 0.9;
    for (let i = 0; i < n; i++) {
      at(first + i * gap, () => spawn(mi, slots[i], i, () => {
        setDigits(String(i + 1), NUM_COLORS[i]);
        setWord(WORDS[i], NUM_COLORS[i]);
        pop(i);
        speak(WORDS[i]);
      }));
    }
    const end = first + (n - 1) * gap + 1.3;
    at(end, () => {
      const phrase = `${cap(WORDS[n - 1])} ${m.name[n === 1 ? 0 : 1]}!`;
      setWord(phrase, NUM_COLORS[n - 1]);
      hintEl.textContent = n === 10 ? "You counted all the way to ten!" : "Great counting!";
      digitVox.forEach((d) => { if (d.s.t > 0) d.s.vel += reduceMotion ? 0 : 6; });
      hopAll(); burst(); fanfare(n); speak(phrase);
    });
    const hold = n === 10 ? 4 : 2.8;
    at(end + hold, () => { exitObjects(); setDigits("", NUM_COLORS[0]); });
    at(end + hold + 0.9, () => startChapter((n % 10) + 1));
  }
  function go(n) { setPlaying(true); startChapter(n); }

  // ---------- controls ----------
  const playBtn = document.getElementById("play"), playIcon = document.getElementById("playIcon");
  function setPlaying(p) {
    playing = p;
    playBtn.setAttribute("aria-label", p ? "Pause" : "Play");
    playIcon.setAttribute("d", p ? "M7 5h4v14H7zM13 5h4v14h-4z" : "M8 5v14l11-7z");
  }
  playBtn.addEventListener("click", () => setPlaying(!playing));
  document.getElementById("prev").addEventListener("click", () => go(Math.max(1, chapter - 1)));
  document.getElementById("next").addEventListener("click", () => go((chapter % 10) + 1));
  const soundBtn = document.getElementById("sound"), soundLabel = document.getElementById("soundLabel"), waves = document.getElementById("waves");
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    if (soundOn) {
      try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) { audio = null; }
      tone(660, 0, 0.25, 0.15);
    } else {
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    }
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    soundLabel.textContent = soundOn ? "Sound off" : "Sound on";
    waves.setAttribute("opacity", soundOn ? "1" : "0.3");
  });
  window.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("button")) { if (e.key === " " || e.key === "Enter") return; }
    if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === "ArrowRight") go((chapter % 10) + 1);
    else if (e.key === "ArrowLeft") go(Math.max(1, chapter - 1));
    else if (/^[0-9]$/.test(e.key)) go(e.key === "0" ? 10 : Number(e.key));
  });

  // ---------- simulation ----------
  const G = 25;
  function simulate(dt) {
    for (const o of objects) {
      if (o.exitAt !== null && !o.exiting && simTime >= o.exitAt) {
        o.exiting = true; o.vy = reduceMotion ? 2 : 6.5; o.s.t = 0; o.r.t += reduceMotion ? 0 : Math.PI * 2;
      }
      o.vy -= G * dt; o.y += o.vy * dt;
      if (o.y < 0) {
        const impact = -o.vy; o.y = 0;
        if (impact > 2) { o.vy = impact * 0.3; if (!reduceMotion) o.sq.vel -= impact * 0.45; } else o.vy = 0;
        if (!o.landed) { o.landed = true; if (!o.exiting) o.onLand(); }
      }
      step(o.s, o.exiting ? 30 : 90, damp(o.exiting ? 30 : 90, o.exiting ? 2 : 1.1), dt);
      step(o.sq, 170, damp(170, 0.7), dt);
      step(o.r, 50, damp(50, 1.0), dt);
      const sc = Math.max(0.0001, o.s.v), sy = Math.min(1.5, Math.max(0.55, o.sq.v));
      o.mesh.scale.set(sc / Math.sqrt(sy), sc * sy, sc / Math.sqrt(sy));
      o.mesh.position.set(o.x, o.y, o.z);
      o.mesh.rotation.y = o.r.v + (reduceMotion ? 0 : Math.sin(simTime * 1.6 + o.phase) * 0.14);
    }
    objects = objects.filter((o) => {
      if (o.exiting && o.s.v < 0.02 && simTime - o.exitAt > 0.6) { scene.remove(o.mesh); return false; }
      return true;
    });

    for (const d of digitVox) {
      step(d.x, d.k, damp(d.k, 1.0), dt); step(d.y, d.k, damp(d.k, 1.0), dt); step(d.z, d.k, damp(d.k, 1.0), dt);
      step(d.s, 110, damp(110, 1.1), dt);
      d.color.lerp(d.ct, Math.min(1, dt * 6));
      d.mesh.material.color.copy(d.color);
      d.mesh.position.set(d.x.v, d.y.v, d.z.v);
      d.mesh.scale.setScalar(Math.max(0.0001, d.s.v));
      d.mesh.rotation.x = reduceMotion ? 0 : d.y.vel * 0.06;
      d.mesh.rotation.z = reduceMotion ? 0 : -d.x.vel * 0.06;
    }
    digitGroup.rotation.y = reduceMotion ? 0 : Math.sin(simTime * 0.7) * 0.18;
    digitGroup.position.y = reduceMotion ? 0 : Math.sin(simTime * 1.3) * 0.08;

    for (const c of confetti) {
      if (c.life <= 0) continue;
      c.life -= dt;
      c.v.y -= 12 * dt; c.v.multiplyScalar(1 - dt * 0.6);
      c.p.addScaledVector(c.v, dt);
      if (c.p.y < 0.09 && Math.abs(c.p.x) < 7.5 && Math.abs(c.p.z) < 3.2) { c.p.y = 0.09; c.v.y *= -0.3; c.v.x *= 0.6; c.v.z *= 0.6; }
      c.mesh.position.copy(c.p);
      c.mesh.rotation.x += c.spin.x * dt; c.mesh.rotation.y += c.spin.y * dt;
      c.mesh.scale.setScalar(Math.max(0.0001, Math.min(1, c.life / 0.6)));
      if (c.life <= 0) c.mesh.visible = false;
    }
  }

  // ---------- camera & resize ----------
  let camDist = 13;
  function resize() {
    const w = stage.clientWidth || window.innerWidth, h = stage.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    const buf = renderer.getDrawingBufferSize(new THREE.Vector2());
    sceneRT.setSize(buf.x, buf.y);
    postMat.uniforms.uRes.value.copy(buf);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    const halfTan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    camDist = Math.max(13, 5.4 / (halfTan * camera.aspect));
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const t = now / 1000;
    if (playing) {
      simTime += dt;
      while (queue.length && queue[0].t <= simTime) queue.shift().fn();
      simulate(dt);
    }
    for (const c of clouds) { c.m.position.x += c.speed * dt; if (c.m.position.x > 28) c.m.position.x = -28; }
    const sway = reduceMotion ? 0 : 1;
    camera.position.set(Math.sin(t * 0.15) * 1.4 * sway, 2.6 + camDist * 0.16 + Math.sin(t * 0.21) * 0.2 * sway, camDist);
    camera.lookAt(0, 1.1 + camDist * 0.04, 0);
    const shaderTime = reduceMotion ? 0 : t;
    skyMat.uniforms.uTime.value = shaderTime;
    sparkMat.uniforms.uTime.value = shaderTime;
    renderer.setRenderTarget(sceneRT);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCam);
  }
  startChapter(1);
  requestAnimationFrame(frame);
})();
</script>
